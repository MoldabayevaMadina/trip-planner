server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API, the admin and Django's static files (admin, Swagger) go to the backend container.
    # "backend" is the service name from compose.yaml: Docker's network turns it into the container's address.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;                  # keep "localhost:8080" for Django's host and CSRF checks
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router pages (/trips, /profile, /login...) are not files:
    # if no such file exists, give index.html and let React show the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}