services:
  db:
    image: postgres:16-alpine
    container_name: trip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - trip-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: trip-backend
    restart: unless-stopped
    environment:
      DB_HOST: db     
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}

      GEOCODER_URL: "${GEOCODER_URL:-https://nominatim.openstreetmap.org/search}"
      GEOCODER_USER_AGENT: "${GEOCODER_USER_AGENT:-TripPlanner/1.0 (student project)}"
      PHOTON_URL: "${PHOTON_URL:-https://photon.komoot.io/api/}"
      WEATHER_FORECAST_URL: "${WEATHER_FORECAST_URL:-https://api.open-meteo.com/v1/forecast}"
      WEATHER_ARCHIVE_URL: "${WEATHER_ARCHIVE_URL:-https://archive-api.open-meteo.com/v1/archive}"
      WEATHER_CACHE_MINUTES: "${WEATHER_CACHE_MINUTES:-180}"
      HTTP_TIMEOUT: "${HTTP_TIMEOUT:-6}"
    ports:
      - "${HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trip-net

volumes:
  pgdata:

networks:
  trip-net:
    driver: bridge