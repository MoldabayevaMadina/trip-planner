      properties:
        id:
          type: integer
          readOnly: true
        day:
          type: integer
        place:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        category:
          type: string
          readOnly: true
        time:
          type: string
          format: time
          nullable: true
        visited:
          type: boolean
