        the same) and an optional title.'
      properties:
        start_date:
          type: string
          format: date
        title:
          type: string
          maxLength: 120
      required:
      - start_date
    TripDaysResponse:
      type: object
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
        weather_available:
          type: boolean
        days:
          type: array
          items:
            $ref: '#/components/schemas/Day'
      required:
      - days
      - trip
      - weather_available
    TripStats:
      type: object
      properties:
        trip:
          type: integer
        title:
          type: string
        days:
          type: integer
        planned_visits:
          type: integer
        unique_places:
          type: integer
        visited:
          type: integer
        visited_percent:
