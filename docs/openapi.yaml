          readOnly: true
        title:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        country:
          allOf:
          - $ref: '#/components/schemas/CountryShort'
          readOnly: true
        owner:
          type: string
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        places_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - country
      - created_at
      - end_date
      - id
      - latitude
      - longitude
      - owner
      - places_count
      - start_date
    TripCopy:
      type: object
