      - date_joined
      - id
      - trips_count
      - username
    Visit:
      type: object
      description: A place planned for a day. Place fields are shown flat, so a visit
        is easy to draw on the map.
      properties:
        id:
          type: integer
          readOnly: true
        day:
          type: integer
        place:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        category:
          type: string
          readOnly: true
        time:
          type: string
          format: time
          nullable: true
        visited:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - category
      - created_at
      - id
      - latitude
      - longitude
      - name
      - place
    VisitCreate:
      type: object
      description: |-
        Body of POST /api/days/{id}/visits/. Ways to add a place to a day:
        1. an existing place:            {"place": 7}
        2. a new place by name:          {"name": "Galata Tower"}           (found on the map near the trip's city)
        3. a new place with coordinates: {"name": "Our hotel", "latitude": 41.03, "longitude": 28.98}
        4. a picked suggestion:          {"name": "Starbucks", "latitude": ..., "longitude": ...,
                                          "address": "...", "osm_id": "node/123"}   (stored once per osm_id)
      properties:
        place:
          type: integer
        name:
          type: string
          maxLength: 120
        category:
          $ref: '#/components/schemas/CategoryEnum'
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        address:
          type: string
          maxLength: 300
        osm_id:
          type: string
          maxLength: 40
        time:
          type: string
          format: time
          nullable: true
        visited:
          type: boolean
          default: false
    Weather:
      type: object
      description: Shape of the "weather" field in a day (used only for API docs).
      properties:
        icon:
          type: string
        text:
          type: string
        temp_max:
          type: number
          format: double
          nullable: true
        temp_min:
          type: number
          format: double
          nullable: true
        rainy:
          type: boolean
        source:
          type: string
      required:
      - icon
      - rainy
      - source
      - temp_max
      - temp_min
      - text
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
