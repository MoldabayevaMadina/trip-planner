      - planned_visits
      - rainy_days
      - title
      - trip
      - unique_places
      - visited
      - visited_percent
    TripStatsDay:
      type: object
      properties:
        date:
          type: string
          format: date
        planned:
          type: integer
        visited:
          type: integer
      required:
      - date
      - planned
      - visited
    User:
      type: object
      description: 'The current user: GET and PATCH /api/auth/me/. The profile is
        nested (one-to-one).'
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        date_joined:
          type: string
          format: date-time
          readOnly: true
        profile:
          $ref: '#/components/schemas/Profile'
        trips_count:
          type: integer
          readOnly: true
