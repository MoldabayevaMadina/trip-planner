          format: email
          title: Email address
          maxLength: 254
        date_joined:
          type: string
          format: date-time
          readOnly: true
        profile:
          $ref: '#/components/schemas/Profile'
        trips_count:
          type: integer
          readOnly: true
    PatchedVisit:
      type: object
      description: A place planned for a day. Place fields are shown flat, so a visit
