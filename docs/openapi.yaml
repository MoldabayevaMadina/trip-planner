openapi: 3.0.3
info:
  title: Trip Planner API
  version: 1.0.0
  description: 'Plan trips day by day: places with coordinates (Nominatim) and weather
    for every day (Open-Meteo).'
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: 'POST /api/auth/change-password/ — {"old_password": "...", "new_password":
        "..."}.'
      summary: Change password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: GET / PATCH /api/auth/me/ — who am I; change username, email, home
        city, bio.
      summary: Current user and profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: GET / PATCH /api/auth/me/ — who am I; change username, email, home
        city, bio.
      summary: Current user and profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: POST /api/auth/register/ — creates a user and logs them in at once.
      summary: Sign up
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/cities/:
    get:
      operationId: cities_list
      description: GET /api/cities/ — every city I travel to, with the number of trips
        (GROUP BY city).
      summary: Cities of my trips
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Country ISO code, e.g. TR
      tags:
      - cities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
          description: ''
  /api/countries/:
    get:
      operationId: countries_list
      description: GET /api/countries/ — countries (public; created automatically
        when a city is geocoded).
      parameters:
      - in: query
        name: visa_free
        schema:
          type: boolean
        description: Only visa-free (true) or visa (false) countries
      tags:
      - countries
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
          description: ''
  /api/countries/{id}/:
    get:
      operationId: countries_retrieve
      description: 'GET / PATCH /api/countries/{id}/ — e.g. mark a country visa-free:
        {"visa_free": true, "visa_free_days": 30}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - countries
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
          description: ''
    patch:
      operationId: countries_partial_update
      description: 'GET / PATCH /api/countries/{id}/ — e.g. mark a country visa-free:
        {"visa_free": true, "visa_free_days": 30}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - countries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCountry'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
          description: ''
  /api/countries/{id}/places/:
    get:
      operationId: countries_places_list
      description: GET /api/countries/{id}/places/ — places planned in my trips to
        this country.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - countries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
          description: ''
  /api/countries/{id}/trips/:
    get:
      operationId: countries_trips_list
      description: GET /api/countries/{id}/trips/ — my trips to this country.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - countries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
          description: ''
  /api/dates/{date}/trips/:
    get:
      operationId: dates_trips_list
      description: GET /api/dates/{YYYY-MM-DD}/trips/ — my trips that go on this date.
      parameters:
      - in: path
        name: date
        schema:
          type: string
        required: true
      tags:
      - dates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
          description: ''
  /api/days/{id}/:
    get:
      operationId: days_retrieve
      description: 'GET / PUT / PATCH /api/days/{id}/ — one day, e.g. to set a note:
        {"note": "museum day"}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - days
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
          description: ''
    put:
      operationId: days_update
      description: 'GET / PUT / PATCH /api/days/{id}/ — one day, e.g. to set a note:
        {"note": "museum day"}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - days
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Day'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
          description: ''
    patch:
      operationId: days_partial_update
      description: 'GET / PUT / PATCH /api/days/{id}/ — one day, e.g. to set a note:
        {"note": "museum day"}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - days
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDay'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
          description: ''
  /api/days/{id}/places/:
    get:
      operationId: days_places_list
      description: GET /api/days/{id}/places/ — places of a day (through the many-to-many
        link).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - days
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
          description: ''
  /api/days/{id}/visits/:
    get:
      operationId: days_visits_list
      description: GET /api/days/{id}/visits/ — the plan of a day. POST — add a place
        to the day.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - days
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
          description: ''
    post:
      operationId: days_visits_create
      description: GET /api/days/{id}/visits/ — the plan of a day. POST — add a place
        to the day.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - days
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitCreate'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
          description: ''
  /api/geocode/:
    get:
      operationId: geocode_retrieve
      description: GET /api/geocode/?q=... — find coordinates without saving anything.
      summary: Preview a place search before adding it
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: What to search, e.g. "Galata Tower, Istanbul"
        required: true
      tags:
      - geocode
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: GET /api/health/ — is the backend up and can it reach the database?
      summary: Backend and database status
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/places/:
    get:
      operationId: places_list
      description: GET /api/places/?category=&search=&trip= — the shared catalog of
        places (public).
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - food
          - museum
          - other
          - shopping
          - sight
          - walk
        description: Category of the place
      - in: query
        name: search
        schema:
          type: string
        description: Name contains the text
      - in: query
        name: trip
        schema:
          type: integer
        description: Only places planned in this trip of mine (needs login)
      tags:
      - places
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
          description: ''
  /api/places/{id}/:
    get:
      operationId: places_retrieve
      description: GET / PUT / PATCH / DELETE /api/places/{id}/. A place that is planned
        in some day can't be deleted (409).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - places
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
          description: ''
    put:
      operationId: places_update
      description: GET / PUT / PATCH / DELETE /api/places/{id}/. A place that is planned
        in some day can't be deleted (409).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - places
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Place'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
          description: ''
    patch:
      operationId: places_partial_update
      description: GET / PUT / PATCH / DELETE /api/places/{id}/. A place that is planned
        in some day can't be deleted (409).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - places
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlace'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
          description: ''
    delete:
      operationId: places_destroy
      description: GET / PUT / PATCH / DELETE /api/places/{id}/. A place that is planned
        in some day can't be deleted (409).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - places
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/places/{id}/days/:
    get:
      operationId: places_days_list
      description: GET /api/places/{id}/days/ — days (of any of my trips) when this
        place is planned.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - places
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayShort'
          description: ''
  /api/places/{id}/trips/:
    get:
      operationId: places_trips_list
      description: GET /api/places/{id}/trips/ — my trips that visit this place.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - places
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
          description: ''
  /api/places/popular/:
    get:
      operationId: places_popular_list
      description: GET /api/places/popular/ — places planned in the most trips of
        all travellers (public, only numbers).
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: How many places, 1–50 (default 10)
      tags:
      - places
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularPlace'
          description: ''
  /api/places/suggest/:
    get:
      operationId: places_suggest_list
      description: GET /api/places/suggest/?q=starb&trip=5 — up to 6 places for the
        dropdown. Nothing is saved.
      summary: Place suggestions while typing
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: What the user is typing, at least 3 characters
        required: true
      - in: query
        name: trip
        schema:
          type: integer
        description: Places near this trip's city come first; other countries are
          hidden
      tags:
      - places
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceSuggestion'
          description: ''
  /api/trips/:
    get:
      operationId: trips_list
      description: GET /api/trips/ — my trips with filters. POST — create a trip (the
        city is geocoded, days are created).
      parameters:
      - in: query
        name: city
        schema:
          type: string
        description: City contains the text, e.g. ist
      - in: query
        name: country
        schema:
          type: string
        description: Country ISO code, e.g. TR
      - in: query
        name: date
        schema:
          type: string
        description: Trips that go on this date, YYYY-MM-DD
      - in: query
        name: date_from
        schema:
          type: string
        description: 'Period start, YYYY-MM-DD: trips that end on or after it'
      - in: query
        name: date_to
        schema:
          type: string
        description: 'Period end, YYYY-MM-DD: trips that start on or before it'
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -city
          - -created_at
          - -start_date
          - -title
          - city
          - created_at
          - start_date
          - title
        description: Sort order, - means descending
      - in: query
        name: search
        schema:
          type: string
        description: Search in title and city
      - in: query
        name: status
        schema:
          type: string
          enum:
          - current
          - past
          - upcoming
        description: Compared with today
      - in: query
        name: visa_free
        schema:
          type: boolean
        description: Only trips to visa-free (true) or visa (false) countries
      tags:
      - trips
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
          description: ''
    post:
      operationId: trips_create
      description: GET /api/trips/ — my trips with filters. POST — create a trip (the
        city is geocoded, days are created).
      parameters:
      - in: query
        name: city
        schema:
          type: string
        description: City contains the text, e.g. ist
      - in: query
        name: country
        schema:
          type: string
        description: Country ISO code, e.g. TR
      - in: query
        name: date
        schema:
          type: string
        description: Trips that go on this date, YYYY-MM-DD
      - in: query
        name: date_from
        schema:
          type: string
        description: 'Period start, YYYY-MM-DD: trips that end on or after it'
      - in: query
        name: date_to
        schema:
          type: string
        description: 'Period end, YYYY-MM-DD: trips that start on or before it'
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -city
          - -created_at
          - -start_date
          - -title
          - city
          - created_at
          - start_date
          - title
        description: Sort order, - means descending
      - in: query
        name: search
        schema:
          type: string
        description: Search in title and city
      - in: query
        name: status
        schema:
          type: string
          enum:
          - current
          - past
          - upcoming
        description: Compared with today
      - in: query
        name: visa_free
        schema:
          type: boolean
        description: Only trips to visa-free (true) or visa (false) countries
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trip'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/trips/{id}/:
    get:
      operationId: trips_retrieve
      description: GET / PUT / PATCH / DELETE /api/trips/{id}/ — one of my trips.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - trips
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
    put:
      operationId: trips_update
      description: GET / PUT / PATCH / DELETE /api/trips/{id}/ — one of my trips.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trip'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
    patch:
      operationId: trips_partial_update
      description: GET / PUT / PATCH / DELETE /api/trips/{id}/ — one of my trips.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTrip'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
    delete:
      operationId: trips_destroy
      description: GET / PUT / PATCH / DELETE /api/trips/{id}/ — one of my trips.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - trips
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/trips/{id}/copy/:
    post:
      operationId: trips_copy_create
      description: POST /api/trips/{id}/copy/ — a new trip with the same city and
        plan, starting on another date.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCopy'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/trips/{id}/days/:
    get:
      operationId: trips_days_retrieve
      description: GET /api/trips/{id}/days/ — days with visits and weather. Stale
        weather is refreshed here.
      summary: Days of a trip with visits and weather
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - trips
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDaysResponse'
          description: ''
  /api/trips/{id}/places/:
    get:
      operationId: trips_places_list
      description: GET /api/trips/{id}/places/ — places planned in this trip (each
        place once).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - trips
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
          description: ''
  /api/trips/{id}/stats/:
    get:
      operationId: trips_stats_retrieve
      description: GET /api/trips/{id}/stats/ — numbers of a trip, counted by the
        database (aggregate / annotate).
      summary: Statistics of a trip
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - trips
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripStats'
          description: ''
  /api/visits/:
    get:
      operationId: visits_list
      description: GET /api/visits/?trip=&date=&visited=&category= — all my planned
        places with filters.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - food
          - museum
          - other
          - shopping
          - sight
          - walk
        description: Category of the place
      - in: query
        name: date
        schema:
          type: string
        description: Only visits on this date, YYYY-MM-DD
      - in: query
        name: trip
        schema:
          type: integer
        description: Only visits of this trip
      - in: query
        name: visited
        schema:
          type: boolean
        description: true / false
      tags:
      - visits
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
          description: ''
  /api/visits/{id}/:
    get:
      operationId: visits_retrieve
      description: GET / PUT / PATCH / DELETE /api/visits/{id}/ — mark visited, change
        time, move to another day.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - visits
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
          description: ''
    put:
      operationId: visits_update
      description: GET / PUT / PATCH / DELETE /api/visits/{id}/ — mark visited, change
        time, move to another day.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Visit'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
          description: ''
    patch:
      operationId: visits_partial_update
      description: GET / PUT / PATCH / DELETE /api/visits/{id}/ — mark visited, change
        time, move to another day.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVisit'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
          description: ''
    delete:
      operationId: visits_destroy
      description: GET / PUT / PATCH / DELETE /api/visits/{id}/ — mark visited, change
        time, move to another day.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - visits
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    CategoryEnum:
      enum:
      - sight
      - museum
      - food
      - walk
      - shopping
      - other
      type: string
      description: |-
        * `sight` - Sight
        * `museum` - Museum
        * `food` - Food
        * `walk` - Walk
        * `shopping` - Shopping
        * `other` - Other
    ChangePassword:
      type: object
      description: POST /api/auth/change-password/ — the old password is required.
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - old_password
    ChangePasswordResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    City:
      type: object
      properties:
        city:
          type: string
        country:
          type: string
          nullable: true
        country_code:
          type: string
          nullable: true
        trips_count:
          type: integer
      required:
      - city
      - country
      - country_code
      - trips_count
    Country:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        visa_free:
          type: boolean
        visa_free_days:
          type: integer
          maximum: 365
          minimum: 1
          nullable: true
        trips_count:
          type: integer
          readOnly: true
      required:
      - code
      - id
      - name
      - trips_count
    CountryShort:
      type: object
      description: Country inside a trip.
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 2
        name:
          type: string
          maxLength: 80
        visa_free:
          type: boolean
      required:
      - code
      - id
      - name
    Day:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        trip:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        note:
          type: string
          maxLength: 200
        weather:
          allOf:
          - $ref: '#/components/schemas/Weather'
          nullable: true
          readOnly: true
        visits:
          type: array
          items:
            $ref: '#/components/schemas/Visit'
          readOnly: true
      required:
      - date
      - id
      - trip
      - visits
      - weather
    DayShort:
      type: object
      description: A day with its trip, for lists like "days when this place is visited".
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        trip:
          type: integer
        trip_title:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        note:
          type: string
          maxLength: 200
      required:
      - city
      - date
      - id
      - trip
      - trip_title
    GeocodeResponse:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        name:
          type: string
        address:
          type: string
        country:
          type: string
        country_code:
          type: string
        osm_id:
          type: string
      required:
      - address
      - country
      - country_code
      - latitude
      - longitude
      - name
      - osm_id
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        db:
          type: string
      required:
      - db
      - status
    PatchedCountry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        visa_free:
          type: boolean
        visa_free_days:
          type: integer
          maximum: 365
          minimum: 1
          nullable: true
        trips_count:
          type: integer
          readOnly: true
    PatchedDay:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        trip:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        note:
          type: string
          maxLength: 200
        weather:
          allOf:
          - $ref: '#/components/schemas/Weather'
          nullable: true
          readOnly: true
        visits:
          type: array
