        name:
          type: string
          maxLength: 120
        address:
          type: string
          readOnly: true
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        category:
          $ref: '#/components/schemas/CategoryEnum'
        osm_id:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        trips_count:
          type: integer
