      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
      required:
      - id
      - password
      - username
    RegisterResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - refresh
      - user
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
